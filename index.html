<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love you 💌</title>
    
    <!-- Thêm dòng này để tải font chữ viết tay -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i love you 💌</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="music" src="tadavatvaroima.mp3"></audio>

<div id="envelope">
    <!-- Mặt lưng của phong bì -->
    <div class="envelope-back"></div>
    
    <!-- Lá thư bên trong -->
    <div class="letter">
        <div id="text"></div>
    </div>
    
    <!-- Các nắp phong bì mặt trước -->
    <div class="flap-wrapper flap-left">
        <div class="flap"></div>
    </div>
    
    <div class="flap-wrapper flap-right">
        <div class="flap"></div>
    </div>
    
    <div class="flap-wrapper flap-bottom">
        <div class="flap"></div>
    </div>
    
    <!-- Nắp trên cùng có bọc riêng để làm hiệu ứng mở -->
    <div class="flap-wrapper flap-top-wrapper">
        <div class="flap flap-top"></div>
    </div>
</div>

<div id="hearts"></div>

<script src="script.js"></script>

</body>
</html>
