<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ĐÀN THỎ (Bên trái) -->
    <div class="bunny-decor">
        <img src="thỏ.png" alt="Đàn thỏ trang trí">
    </div>

    <!-- BAO THƯ VÀ BỨC THƯ (Ở chính giữa) -->
    <div id="envelope" class="letter-closed">
        <div class="letter">
            <div id="text"></div>
        </div>
        <div class="envelope-back"></div>
        <div class="flap-wrapper flap-left"><div class="flap"></div></div>
        <div class="flap-wrapper flap-right"><div class="flap"></div></div>
        <div class="flap-wrapper flap-bottom"><div class="flap"></div></div>
        <div class="flap-wrapper flap-top-wrapper"><div class="flap flap-top"></div></div>
    </div>

    <!-- ẢNH CẶP ĐÔI (Bên phải) -->
    <div class="couple-photo">
        <img src="anhvaemm.png" alt="Couple Photo">
    </div>

    <!-- Dòng chữ nghệ thuật phía dưới -->
    <div class="outside-title">
        <img src="image-removebg-preview.png" alt="Anniversary Title">
    </div>

    <!-- Âm thanh và Script -->
    <audio id="music" src="tadavatvaroima.mp3" loop></audio>
    <script src="script.js"></script>
</body>
</html>
